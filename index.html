<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Net Worth</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Net Worth">
<meta name="theme-color" content="#12141A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root {
  --bg-a: #F3F5F9; --bg-b: #E7EBF3;
  --surface: #FFFFFF; --surface-2: #F1F3F8;
  --line: rgba(18, 20, 26, 0.09);
  --text: #12141A; --muted: #6B7080;
  --up: #1E9E4A; --down: #D93025; --accent: #0A7FC2;
  --btn: #12141A; --btn-text: #FFFFFF;
  --shadow: 0 1px 2px rgba(18,20,26,.06), 0 8px 24px rgba(18,20,26,.06);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-a: #12141A; --bg-b: #1F2433;
    --surface: #1A1E29; --surface-2: #232838;
    --line: rgba(255, 255, 255, 0.08);
    --text: #F2F3F7; --muted: #8E8E93;
    --up: #30D158; --down: #FF453A; --accent: #64D2FF;
    --btn: #F2F3F7; --btn-text: #12141A;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-a: #12141A; --bg-b: #1F2433;
  --surface: #1A1E29; --surface-2: #232838;
  --line: rgba(255, 255, 255, 0.08);
  --text: #F2F3F7; --muted: #8E8E93;
  --up: #30D158; --down: #FF453A; --accent: #64D2FF;
  --btn: #F2F3F7; --btn-text: #12141A;
  --shadow: none;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(160deg, var(--bg-a), var(--bg-b)) fixed;
  background-color: var(--bg-a);
  color: var(--text);
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  font-size: 16px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
main { max-width: 560px; margin: 0 auto; padding: 20px 18px 48px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Hero */
.hero { padding: 8px 2px 4px; }
.hero-label { color: var(--muted); font-size: 15px; font-weight: 600; margin: 0; }
.hero-total { font-size: clamp(44px, 13vw, 64px); font-weight: 800; letter-spacing: -0.02em; margin: 2px 0 4px; line-height: 1.05; }
.hero-change { font-size: 15px; font-weight: 600; margin: 0; color: var(--muted); }
.hero-change .up { color: var(--up); }
.hero-change .down { color: var(--down); }

/* Movers */
.movers { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; scrollbar-width: none; }
.movers::-webkit-scrollbar { display: none; }
.mover { flex: 1 0 auto; max-width: 70%; background: var(--surface); box-shadow: var(--shadow); border-radius: 14px; padding: 9px 12px; display: flex; flex-direction: column; min-width: 0; }
.mover-name { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.mover-amt { font-size: 16px; font-weight: 800; }
.mover-amt.up { color: var(--up); }
.mover-amt.down { color: var(--down); }

/* View toggle, allocation, bars */
.view-seg { margin-bottom: 14px; }
.view-seg button { font-size: 14px; padding: 8px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.alloc { background: var(--surface); border-radius: 20px; padding: 14px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.alloc-bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.alloc-bar span { display: block; min-width: 3px; }
.alloc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
.alloc-legend b { color: var(--text); font-weight: 800; margin-left: 2px; }
.bars-wrap { margin: 14px 0 0; }
.bars-title { margin: 0 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.bars { width: 100%; height: 90px; display: block; }
.bars-note { margin: 6px 0 0; font-size: 13px; color: var(--muted); }
.bars-note .up { color: var(--up); }
.bars-note .down { color: var(--down); }
.select { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--surface-2); border: 0; border-radius: 12px; padding: 12px; -webkit-appearance: none; appearance: none; }

.hero-equity { margin: 6px 0 0; font-size: 15px; font-weight: 600; color: var(--muted); }
.hero-equity b { color: var(--text); font-weight: 800; }

/* Tabs + budget */
.tabs { max-width: 560px; margin: 0 auto; padding: 14px 18px 0; }
.tab-seg button { font-size: 15px; font-weight: 800; padding: 9px; }
.b-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); cursor: pointer; -webkit-tap-highlight-color: transparent; }
.b-row.child { padding-left: 14px; }
.b-row.child .b-name { font-weight: 500; }
.b-name { font-weight: 600; min-width: 0; }
.b-sub { font-size: 12px; color: var(--muted); font-weight: 500; margin-top: 1px; }
.b-note { font-size: 12px; color: var(--down); font-weight: 600; margin-top: 1px; }
.b-amt { font-weight: 700; flex-shrink: 0; text-align: right; }
.b-row.open .b-name { color: var(--accent); }
.b-detail { padding: 0 0 12px; animation: grow .18s ease-out; }
.b-detail.child { padding-left: 14px; }
.b-detail .b-sub, .b-detail .b-note { margin: 0 0 8px; font-size: 13px; }
.b-quick { display: flex; gap: 8px; }
.b-q { flex: 1; min-width: 0; background: var(--surface-2); border-radius: 12px; padding: 6px 10px; }
.b-q span { display: block; font-size: 11px; color: var(--muted); font-weight: 700; }
.b-q input { width: 100%; border: 0; background: transparent; color: var(--text); font: inherit; font-size: 17px; font-weight: 800; padding: 2px 0; font-variant-numeric: tabular-nums; }
.b-q input:focus { outline: none; }
.b-q:focus-within { outline: 2px solid var(--accent); }
.b-actions { display: flex; gap: 8px; margin-top: 8px; }
.b-actions button { flex: 1; border: 0; border-radius: 12px; padding: 10px; font-weight: 800; font-size: 14px; }
.b-save { background: var(--btn); color: var(--btn-text); }
.sub-head { margin: 4px 0 6px; font-size: 13px; color: var(--muted); font-weight: 700; }
.sub-list { background: var(--surface-2); border-radius: 14px; padding: 0 12px; }
.sub-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.sub-row:first-child { border-top: 0; }
.sub-row .b-name { font-weight: 600; }
.sub-row .b-amt { font-weight: 700; }
.sub-add { margin-top: 4px; font-size: 15px; }
.b-more { background: var(--surface-2); color: var(--muted); }
.b-caret { color: var(--muted); font-size: 12px; margin-left: 6px; }
.pay-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pay-grid div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.pay-grid span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.pay-grid b { display: block; font-size: 17px; font-weight: 800; }
.pay-grid em { display: block; font-style: normal; font-size: 13px; font-weight: 700; }
.pay-grid em.up, .b-pos { color: var(--up); }
.pay-grid em.down, .b-neg { color: var(--down); }
.card-title { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
.joint-line { display: flex; justify-content: space-between; font-weight: 700; padding: 4px 0; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.toggle-row label { color: var(--muted); font-size: 14px; font-weight: 600; }

/* Chart */
.chart-wrap { margin: 18px 0 6px; }
.chart { width: 100%; height: 170px; display: block; overflow: visible; }
.ranges { display: flex; gap: 6px; margin-top: 10px; }
.ranges button {
  border: 0; background: transparent; color: var(--muted);
  padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 700;
}
.ranges button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }
.chart-empty { height: 170px; display: grid; place-items: center; color: var(--muted); font-size: 14px; border: 1px dashed var(--line); border-radius: 16px; text-align: center; padding: 0 24px; }

/* Primary action */
.primary {
  width: 100%; border: 0; border-radius: 16px; padding: 16px;
  background: var(--btn); color: var(--btn-text);
  font-size: 17px; font-weight: 800; margin: 18px 0 26px;
}
.primary:disabled { opacity: .4; cursor: default; }

/* Account groups */
.group { background: var(--surface); border-radius: 20px; padding: 6px 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.group-head { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 0 8px; }
.group-head h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 700; }
.group-head span { font-weight: 800; font-size: 17px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.row-name { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-right { text-align: right; flex-shrink: 0; }
.row-amt { font-weight: 700; }
.row-delta { font-size: 12px; color: var(--muted); }
.row-delta.up { color: var(--up); }
.row-delta.down { color: var(--down); }

/* Expandable account rows */
.acct-toggle { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.acct-toggle[aria-expanded="true"] .row-name { color: var(--accent); }
.acct-chart { padding: 2px 0 14px; animation: grow .2s ease-out; }
@media (prefers-reduced-motion: reduce) { .acct-chart { animation: none; } }
@keyframes grow { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.acct-svg { width: 100%; height: 120px; display: block; overflow: visible; }
.acct-stats { display: flex; gap: 8px; margin-top: 8px; }
.acct-stats div { flex: 1; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.acct-stats span { display: block; font-size: 12px; color: var(--muted); font-weight: 600; }
.acct-stats b { font-size: 15px; font-weight: 800; }
.acct-stats b.up { color: var(--up); }
.acct-stats b.down { color: var(--down); }
.acct-chart .ranges { margin-top: 10px; }
.acct-chart .ranges button { padding: 4px 10px; font-size: 13px; }
.acct-sum { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.equity-row { border-top-style: dashed; }
.equity-row .row-name { color: var(--muted); }

/* History */
details.history { background: var(--surface); border-radius: 20px; padding: 0 16px; box-shadow: var(--shadow); margin-bottom: 18px; }
details.history summary { list-style: none; padding: 16px 0; font-weight: 700; color: var(--muted); font-size: 15px; display: flex; justify-content: space-between; }
details.history summary::-webkit-details-marker { display: none; }
details.history summary::after { content: "Show"; color: var(--accent); font-weight: 700; }
details.history[open] summary::after { content: "Hide"; }
.hist-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.hist-date { flex: 1; font-weight: 600; }
.hist-amt { font-weight: 700; }
.icon-btn { border: 0; background: var(--surface-2); border-radius: 10px; padding: 6px 10px; font-size: 13px; font-weight: 700; color: var(--muted); }

.footer { display: flex; gap: 10px; }
.secondary { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 13px; font-weight: 700; font-size: 15px; box-shadow: var(--shadow); }

/* Empty / notice */
.notice { background: var(--surface); border-radius: 20px; padding: 22px 18px; box-shadow: var(--shadow); margin-top: 14px; }
.notice h2 { margin: 0 0 6px; font-size: 20px; }
.notice p { margin: 0 0 14px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-text); border-color: transparent; }

/* Sheets */
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
.overlay.open { display: flex; }
.sheet {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 24px 24px 0 0; padding: 18px 18px calc(20px + env(safe-area-inset-bottom, 0px));
  max-height: 92vh; overflow-y: auto;
  animation: up .22s ease-out;
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
.sheet-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.sheet-top h2 { margin: 0; font-size: 19px; }
.text-btn { border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 16px; padding: 6px 2px; }
.step-meta { color: var(--muted); font-size: 14px; font-weight: 600; margin: 0 0 4px; }
.step-name { font-size: 26px; font-weight: 800; margin: 0 0 2px; }
.step-kind { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
.money-field { display: flex; align-items: center; background: var(--surface-2); border-radius: 16px; padding: 4px 16px; }
.money-field span { font-size: 34px; font-weight: 800; color: var(--muted); }
.money-field input {
  flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 38px; font-weight: 800; padding: 10px 6px; font-variant-numeric: tabular-nums;
}
.money-field input:focus { outline: none; }
.money-field:focus-within { outline: 2px solid var(--accent); }
.last-val { color: var(--muted); font-size: 13px; margin: 8px 2px 18px; }
.step-actions { display: flex; gap: 10px; }
.step-actions button { flex: 1; border-radius: 14px; padding: 15px; font-weight: 800; font-size: 16px; border: 0; }
.step-actions .back { background: var(--surface-2); }
.step-actions .next { background: var(--btn); color: var(--btn-text); }
.progress { height: 4px; background: var(--surface-2); border-radius: 4px; margin-bottom: 18px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .2s; }
.date-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; color: var(--muted); font-weight: 600; font-size: 14px; }
.date-row input { font: inherit; color: var(--text); background: var(--surface-2); border: 0; border-radius: 10px; padding: 6px 10px; }

.field { display: block; margin-bottom: 14px; }
.field label { display: block; color: var(--muted); font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.field input { width: 100%; font: inherit; font-size: 17px; color: var(--text); background: var(--surface-2); border: 0; border-radius: 12px; padding: 12px; }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { flex: 1; border: 0; background: transparent; padding: 9px; border-radius: 10px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.acct-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.acct-row .row-name { flex: 1; }
.acct-kind { color: var(--muted); font-size: 13px; }
.danger { color: var(--down); }
.archived-title { color: var(--muted); font-size: 14px; font-weight: 700; margin: 18px 0 4px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--btn); color: var(--btn-text); padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.loading { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>

<nav class="tabs" aria-label="Sections">
  <div class="seg tab-seg" role="group">
    <button data-tab="nw" aria-pressed="true">Net Worth</button>
    <button data-tab="budget" aria-pressed="false">Budget</button>

<main id="app"><p class="loading">Loading…</p></main>
<main id="budgetApp" hidden><p class="loading">Loading…</p></main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true">
  <div class="sheet" id="sheet"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="msal-browser.min.js"></script>
<script>
// ====== CONFIG: paste your Application (client) ID from the Microsoft app registration ======
const CLIENT_ID = "ca35613d-1cc6-4ddc-b020-b85fe7f9ef63";
// ============================================================================================
(() => {
  // ---------- state ----------
  let msal = null, account = null, etags = { accounts: null, balances: null };
  let saving = false;
  window.addEventListener("beforeunload", e => { if (saving) { e.preventDefault(); e.returnValue = ""; } });
  let state = { accounts: [], snapshots: [] };
  let loaded = false;
  let range = "12M";
  let acctRange = "12M";
  const RANGES = { "3M": 92, "6M": 183, "12M": 366, "All": Infinity };
  const rangeButtons = (current, attr, label) => `<div class="ranges" role="group" aria-label="${label}">
    ${Object.keys(RANGES).map(r => `<button ${attr}="${r}" aria-pressed="${r === current}">${r}</button>`).join("")}
  </div>`;
  let openAcct = null;
  let view = "household";
  const CATEGORIES = [
    { id: "cash", name: "Cash", kind: "asset", color: "#64D2FF" },
    { id: "savings", name: "Savings", kind: "asset", color: "#30D158" },
    { id: "retirement", name: "Retirement & HSA", kind: "asset", color: "#BF5AF2" },
    { id: "investments", name: "Investments", kind: "asset", color: "#FF9F0A" },
    { id: "property", name: "Home & vehicles", kind: "asset", color: "#FFD60A" },
    { id: "other", name: "Other assets", kind: "asset", color: "#8E8E93" },
    { id: "cards", name: "Credit cards", kind: "liability" },
    { id: "loans", name: "Loans", kind: "liability" },
  ];
  const catOf = a => {
    const c = CATEGORIES.find(c => c.id === a.category && c.kind === a.kind);
    return c ? c.id : (a.kind === "liability" ? "loans" : "other");
  };
  const catOrder = a => CATEGORIES.findIndex(c => c.id === catOf(a));
  const OWNERS = [["household", "Household"], ["kyle", "Kyle"], ["victoria", "Victoria"]];
  const ownerOf = a => a.owner || "kyle";
  const inView = a => view === "household" || (view === "kyle" ? ownerOf(a) !== "victoria" : ownerOf(a) === "victoria");
  let writeChain = Promise.resolve();

  const $app = document.getElementById("app");
  const $overlay = document.getElementById("overlay");
  const $sheet = document.getElementById("sheet");
  const $toast = document.getElementById("toast");

  const fmt0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const fmt2 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
  const parseISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const niceDate = s => parseISO(s).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  const shortDate = s => parseISO(s).toLocaleDateString("en-US", { month: "short", day: "numeric" });
  const newId = () => "a" + Math.random().toString(36).slice(2, 9);
  const clone = o => JSON.parse(JSON.stringify(o));
  const signed = n => (n >= 0 ? "+" : "−") + fmt0.format(Math.abs(n));

  function toast(msg) {
    $toast.textContent = msg;
    $toast.classList.add("show");
    clearTimeout(toast.t);
    toast.t = setTimeout(() => $toast.classList.remove("show"), 2400);
  }

  // ---------- persistence ----------
  // ---------- OneDrive (Microsoft Graph) ----------
  const SCOPES = ["Files.ReadWrite.AppFolder"];
  const GRAPH = "https://graph.microsoft.com/v1.0/me/drive/special/approot:";
  const CACHE_KEY = "nw-cache-v1";

  async function token() {
    try {
      return (await msal.acquireTokenSilent({ scopes: SCOPES, account })).accessToken;
    } catch (e) {
      await msal.acquireTokenRedirect({ scopes: SCOPES, account });
      throw new Error("redirecting");
    }
  }

  async function readFile(name) {
    const t = await token();
    const meta = await fetch(`${GRAPH}/${name}`, { headers: { Authorization: `Bearer ${t}` } });
    if (meta.status === 404) return { text: null, etag: null };
    if (!meta.ok) throw new Error(`read ${name}: ${meta.status}`);
    const m = await meta.json();
    const body = await fetch(m["@microsoft.graph.downloadUrl"]);
    if (!body.ok) throw new Error(`download ${name}: ${body.status}`);
    return { text: await body.text(), etag: m.eTag };
  }

  async function writeFile(name, text, etag) {
    const t = await token();
    const headers = { Authorization: `Bearer ${t}`, "Content-Type": "text/csv" };
    if (etag) headers["If-Match"] = etag;
    const res = await fetch(`${GRAPH}/${name}:/content`, { method: "PUT", headers, body: text });
    if (res.status === 412) { const e = new Error("conflict"); e.code = "conflict"; throw e; }
    if (!res.ok) throw new Error(`write ${name}: ${res.status}`);
    return (await res.json()).eTag;
  }

  // ---------- CSV ----------
  function parseCSV(text) {
    const rows = []; let row = [], cur = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') q = false;
        else cur += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(cur); cur = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(cur); cur = "";
        if (row.some(v => v !== "")) rows.push(row);
        row = [];
      } else cur += c;
    }
    row.push(cur);
    if (row.some(v => v !== "")) rows.push(row);
    if (!rows.length) return [];
    const head = rows.shift().map(h => h.trim().toLowerCase());
    return rows.map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || "").trim()])));
  }
  const cell = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const toCSV = (head, rows) => [head.join(","), ...rows.map(r => r.map(cell).join(","))].join("\n") + "\n";

  function fromFiles(accText, balText) {
    const accounts = accText ? parseCSV(accText).map(r => ({
      id: r.id, name: r.name, kind: r.kind === "liability" ? "liability" : "asset",
      category: r.category || "", owner: r.owner || "kyle", archived: /^(true|yes|1)$/i.test(r.archived || ""),
    })).filter(a => a.id && a.name) : [];
    const kind = Object.fromEntries(accounts.map(a => [a.id, a.kind]));
    const byDate = {};
    if (balText) parseCSV(balText).forEach(r => {
      const v = parseFloat(String(r.balance).replace(/[$,\s]/g, ""));
      if (!r.date || !r.account_id || isNaN(v)) return;
      const d = r.date.slice(0, 10);
      (byDate[d] = byDate[d] || {})[r.account_id] = kind[r.account_id] === "liability" ? -v : v; // file stores debts as negatives
    });
    const snapshots = Object.keys(byDate).sort().map(date => ({ date, balances: byDate[date] }));
    return { accounts, snapshots };
  }

  function toFiles(st) {
    const accText = toCSV(["id", "name", "kind", "category", "owner", "archived"],
      st.accounts.map(a => [a.id, a.name, a.kind, a.category || "", a.owner || "kyle", a.archived ? "true" : "false"]));
    const byId = Object.fromEntries(st.accounts.map(a => [a.id, a]));
    const rows = [];
    [...st.snapshots].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
      st.accounts.forEach(a => {
        const v = s.balances[a.id];
        if (v == null) return;
        rows.push([s.date, a.id, a.name, (a.kind === "liability" ? -v : v).toFixed(2)]);
      });
    });
    const balText = toCSV(["date", "account_id", "account_name", "balance"], rows);
    return { accText, balText };
  }

  function persist() {
    const body = clone(state);
    saving = true;
    writeChain = writeChain.then(async () => {
      const { accText, balText } = toFiles(body);
      // Balances first: if a save gets cut off, you never end up with accounts but no history
      etags.balances = await writeFile("balances.csv", balText, etags.balances);
      etags.accounts = await writeFile("accounts.csv", accText, etags.accounts);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(body)); } catch (e) {}
      saving = false;
      toast("Saved to OneDrive");
    }).catch(e => {
      saving = false;
      if (e.message === "redirecting") return;
      if (e.code === "conflict") {
        toast("The file changed somewhere else. Reloading the latest version.");
        loadFromOneDrive();
      } else toast(navigator.onLine ? `Couldn’t save to OneDrive (${e.message}). Screenshot this.` : "You’re offline. Connect to save.");
    });
    return writeChain;
  }

  // ---------- derived data ----------
  function series() {
    const snaps = [...state.snapshots].sort((a, b) => a.date.localeCompare(b.date));
    const running = {};
    const kind = Object.fromEntries(state.accounts.filter(inView).map(a => [a.id, a.kind]));
    return snaps.map(s => {
      Object.assign(running, s.balances);
      let assets = 0, liabilities = 0, count = 0;
      for (const [id, v] of Object.entries(running)) {
        if (!(id in kind)) continue;
        count++;
        if (kind[id] === "liability") liabilities += v; else assets += v;
      }
      return { date: s.date, assets, liabilities, nw: assets - liabilities, balances: { ...running }, count };
    }).filter(p => p.count > 0);
  }

  function latestBalances() {
    const running = {};
    [...state.snapshots].sort((a, b) => a.date.localeCompare(b.date)).forEach(s => Object.assign(running, s.balances));
    return running;
  }

  // ---------- rendering ----------
  function render() {
    if (!loaded) return;
    const active = state.accounts.filter(a => !a.archived);
    if (!state.accounts.length) return renderEmpty();
    const shown = active.filter(inView);

    const s = series();
    const last = s[s.length - 1];
    const prev = s.length > 1 ? s[s.length - 2] : null;
    const bal = last ? last.balances : {};
    const prevBal = prev ? prev.balances : {};

    let changeHtml = "Add your first balances to start the chart.";
    if (last && prev) {
      const d = last.nw - prev.nw;
      changeHtml = `<span class="${d >= 0 ? "up" : "down"} num">${signed(d)}</span> since ${shortDate(prev.date)}`;
    } else if (last) {
      changeHtml = `First entry on ${shortDate(last.date)}`;
    }

    const isZero = a => bal[a.id] != null && Math.abs(bal[a.id]) < 0.005;
    const groupHtml = cat => {
      const list = shown.filter(a => a.kind === cat.kind && catOf(a) === cat.id && !isZero(a));
      if (!list.length) return "";
      const total = list.reduce((t, a) => t + (bal[a.id] || 0), 0);
      return `<section class="group">
        <div class="group-head"><h2>${cat.color ? `<i class="dot" style="background:${cat.color}"></i>` : ""}${esc(cat.name)}</h2><span class="num">${cat.kind === "liability" ? "−" : ""}${fmt0.format(total)}</span></div>
        ${list.map(a => rowHtml(a, a.kind)).join("")}
        ${cat.id === "property" ? equityHtml() : ""}
      </section>`;
    };
    // Calculated: Home value minus Mortgage balance (nothing to enter)
    function heroEquity() {
      const find = (n, k) => shown.find(a => a.kind === k && a.name.trim().toLowerCase() === n);
      const home = find("home", "asset"), mort = find("mortgage", "liability");
      if (!home || !mort || bal[home.id] == null || bal[mort.id] == null) return "";
      const eq = bal[home.id] - bal[mort.id];
      const pct = bal[home.id] ? Math.round((eq / bal[home.id]) * 100) : 0;
      return `<p class="hero-equity">Home equity <b class="num">${fmt0.format(eq)}</b> <span>(${pct}%)</span></p>`;
    }
    function equityHtml() {
      const find = (n, k) => shown.find(a => a.kind === k && a.name.trim().toLowerCase() === n);
      const home = find("home", "asset"), mort = find("mortgage", "liability");
      if (!home || !mort || bal[home.id] == null || bal[mort.id] == null) return "";
      const eq = bal[home.id] - bal[mort.id];
      const pct = bal[home.id] ? Math.round((eq / bal[home.id]) * 100) : 0;
      let delta = "";
      if (prevBal[home.id] != null && prevBal[mort.id] != null) {
        const d = eq - (prevBal[home.id] - prevBal[mort.id]);
        if (Math.abs(d) >= 0.5) delta = `<div class="row-delta num ${d > 0 ? "up" : "down"}">${signed(d)}</div>`;
      }
      return `<div class="row equity-row"><div class="row-name">Home equity<div class="acct-kind">${pct}% of home value, calculated</div></div>
        <div class="row-right"><div class="row-amt num">${fmt0.format(eq)}</div>${delta}</div></div>`;
    }
    function rowHtml(a, kind) {
          const v = bal[a.id];
          const p = prevBal[a.id];
          let delta = "";
          if (v != null && p != null && v !== p) {
            const d = v - p;
            const good = kind === "liability" ? d < 0 : d > 0;
            delta = `<div class="row-delta num ${good ? "up" : "down"}">${signed(d)}</div>`;
          }
          const open = openAcct === a.id;
          return `<div class="row acct-toggle" data-acct="${a.id}" role="button" tabindex="0" aria-expanded="${open}"><div class="row-name">${esc(a.name)}</div>
            <div class="row-right"><div class="row-amt num">${v == null ? "—" : fmt0.format(v)}</div>${delta}</div></div>
            ${open ? `<div class="acct-chart" id="acctChart"></div>` : ""}`;
    }

    let moversHtml = "";
    if (last && prev) {
      const kindOf = Object.fromEntries(state.accounts.filter(inView).map(a => [a.id, a]));
      const movers = Object.keys(last.balances)
        .filter(id => kindOf[id] && prevBal[id] != null && last.balances[id] !== prevBal[id])
        .map(id => {
          const raw = last.balances[id] - prevBal[id];
          const impact = kindOf[id].kind === "liability" ? -raw : raw; // effect on net worth
          return { name: kindOf[id].name, impact };
        })
        .sort((a, b) => Math.abs(b.impact) - Math.abs(a.impact))
        .slice(0, 3);
      if (movers.length) {
        moversHtml = `<section class="movers" aria-label="Biggest movers since ${shortDate(prev.date)}">
          ${movers.map(m => `<div class="mover"><span class="mover-name">${esc(m.name)}</span>
            <span class="mover-amt num ${m.impact >= 0 ? "up" : "down"}">${signed(m.impact)}</span></div>`).join("")}
        </section>`;
      }
    }

    const zeros = shown.filter(isZero);

    // Allocation of assets by category
    const allocTotals = CATEGORIES.filter(c => c.kind === "asset").map(c => ({
      ...c, v: shown.filter(a => a.kind === "asset" && catOf(a) === c.id).reduce((t, a) => t + Math.max(0, bal[a.id] || 0), 0),
    })).filter(c => c.v > 0);
    const allocSum = allocTotals.reduce((t, c) => t + c.v, 0);
    const allocHtml = allocSum ? `<section class="alloc" aria-label="Where your assets are">
        <div class="alloc-bar">${allocTotals.map(c => `<span style="width:${(c.v / allocSum) * 100}%;background:${c.color}" title="${esc(c.name)}"></span>`).join("")}</div>
        <div class="alloc-legend">${allocTotals.map(c => `<span><i class="dot" style="background:${c.color}"></i>${esc(c.name)} <b class="num">${Math.round((c.v / allocSum) * 100)}%</b></span>`).join("")}</div>
      </section>` : "";
    const zeroOpen = zeros.some(z => z.id === openAcct);
    const zeroHtml = zeros.length ? `<details class="history"${zeroOpen ? " open" : ""}>
        <summary>Zero balance (${zeros.length})</summary>
        ${zeros.map(a => rowHtml(a, a.kind)).join("")}
      </details>` : "";

    const hist = [...s].reverse();
    $app.innerHTML = `
      <div class="seg view-seg" role="group" aria-label="Whose accounts">
        ${OWNERS.map(([k, n]) => `<button data-view="${k}" aria-pressed="${view === k}">${n}</button>`).join("")}
      </div>
      <section class="hero">
        <p class="hero-label">${view === "household" ? "Net worth" : view === "kyle" ? "Kyle’s net worth" : "Victoria’s net worth"}</p>
        <p class="hero-total num">${last ? fmt0.format(last.nw) : "$0"}</p>
        <p class="hero-change">${changeHtml}</p>
        ${heroEquity()}
      </section>
      ${moversHtml}
      <div class="chart-wrap" id="chartWrap"></div>
      <div class="bars-wrap" id="barsWrap"></div>
      <button class="primary" id="updateBtn" ${active.length ? "" : "disabled"}>Update balances</button>
      ${allocHtml}
      ${CATEGORIES.map(groupHtml).join("")}
      ${zeroHtml}
      ${hist.length ? `<details class="history"><summary>History (${hist.length})</summary>
        ${hist.map(h => `<div class="hist-row"><div class="hist-date">${niceDate(h.date)}</div>
          <div class="hist-amt num">${fmt0.format(h.nw)}</div>
          <button class="icon-btn" data-del="${h.date}" aria-label="Delete entry for ${niceDate(h.date)}">Delete</button></div>`).join("")}
      </details>` : ""}
      <div class="footer">
        <button class="secondary" id="manageBtn">Manage accounts</button>
        <button class="secondary" id="exportBtn" ${s.length ? "" : "disabled"}>Export CSV</button>
      </div>`;

    drawChart(s);
    $app.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { view = b.dataset.view; openAcct = null; render(); });
    document.getElementById("updateBtn").onclick = openUpdate;
    document.getElementById("manageBtn").onclick = openManage;
    document.getElementById("exportBtn").onclick = exportCSV;
    $app.querySelectorAll("[data-del]").forEach(b => b.onclick = () => deleteSnapshot(b.dataset.del));
    $app.querySelectorAll(".acct-toggle").forEach(r => {
      const toggle = () => { openAcct = openAcct === r.dataset.acct ? null : r.dataset.acct; render(); };
      r.onclick = toggle;
      r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } };
    });
    if (openAcct) drawAcctChart(openAcct, s);
  }

  // Per-account chart, shown when a row is expanded
  function drawAcctChart(id, all) {
    const el = document.getElementById("acctChart");
    const acct = state.accounts.find(a => a.id === id);
    if (!el || !acct) return;
    const days = RANGES[acctRange];
    const cutoff = Date.now() - days * 86400000;
    const hist = all.filter(p => p.balances[id] != null).map(p => ({ date: p.date, v: p.balances[id] }));
    let pts = hist.filter(p => parseISO(p.date).getTime() >= cutoff);
    const before = hist.filter(p => parseISO(p.date).getTime() < cutoff).pop();
    if (before && pts.length < hist.length) pts = [before, ...pts];
    const toggles = rangeButtons(acctRange, "data-ar", "Account chart range");
    const wire = () => el.querySelectorAll("[data-ar]").forEach(b => b.onclick = e => {
      e.stopPropagation();
      acctRange = b.dataset.ar;
      drawAcctChart(id, all);
    });
    if (pts.length < 2) { el.innerHTML = `<p class="acct-sum">Not enough history in this range.</p>${toggles}`; wire(); return; }

    const W = Math.max(260, el.clientWidth || 300), H = 120, padT = 10, padB = 20;
    const xs = pts.map(p => parseISO(p.date).getTime());
    const ys = pts.map(p => p.v);
    const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 1 : xs[xs.length - 1];
    let y0 = Math.min(...ys), y1 = Math.max(...ys);
    const pad = (y1 - y0) * 0.12 || Math.abs(y1) * 0.05 || 1;
    y0 -= pad; y1 += pad;
    const X = t => ((t - x0) / (x1 - x0)) * (W - 8) + 4;
    const Y = v => padT + (1 - (v - y0) / (y1 - y0)) * (H - padT - padB);
    const line = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
    const area = `${line} L${X(xs[xs.length - 1]).toFixed(1)},${H - padB} L${X(xs[0]).toFixed(1)},${H - padB} Z`;
    const d = ys[ys.length - 1] - ys[0];
    const impact = acct.kind === "liability" ? -d : d;
    const col = impact >= 0 ? "var(--up)" : "var(--down)";
    const hi = Math.max(...ys), lo = Math.min(...ys);
    el.innerHTML = `
      <svg class="acct-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(acct.name)} from ${fmt0.format(ys[0])} to ${fmt0.format(ys[ys.length - 1])}">
        <defs><linearGradient id="afill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#afill)"/>
        <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        <circle cx="${X(xs[xs.length - 1])}" cy="${Y(ys[ys.length - 1])}" r="3.5" fill="${col}"/>
        <text x="4" y="${H - 4}" font-size="11" fill="var(--muted)">${shortDate(pts[0].date)}</text>
        <text x="${W - 4}" y="${H - 4}" font-size="11" fill="var(--muted)" text-anchor="end">${shortDate(pts[pts.length - 1].date)}</text>
      </svg>
      <div class="acct-stats">
        <div><span>Change</span><b class="num ${impact >= 0 ? "up" : "down"}">${signed(d)}</b></div>
        <div><span>High</span><b class="num">${fmt0.format(hi)}</b></div>
        <div><span>Low</span><b class="num">${fmt0.format(lo)}</b></div>
      </div>${toggles}`;
    wire();
  }

  const SUGGESTIONS = [
    ["Checking", "asset"], ["Savings", "asset"], ["401(k)", "asset"], ["Roth IRA", "asset"],
    ["Brokerage", "asset"], ["HSA", "asset"], ["Home", "asset"], ["Car", "asset"],
    ["Mortgage", "liability"], ["Car loan", "liability"], ["Credit card", "liability"], ["Student loan", "liability"],
  ];

  function renderEmpty() {
    const picked = new Set();
    $app.innerHTML = `
      <section class="hero">
        <p class="hero-label">Net worth</p>
        <p class="hero-total num">$0</p>
      </section>
      <section class="notice">
        <h2>Pick your accounts</h2>
        <p>Tap the ones you have. You can rename, add, or remove accounts any time.</p>
        <div class="chips" id="chips">
          ${SUGGESTIONS.map(([n, k], i) => `<button class="chip" data-i="${i}" aria-pressed="false">${esc(n)}</button>`).join("")}
        </div>
        <button class="primary" id="startBtn" disabled>Add accounts</button>
        <button class="text-btn" id="customBtn">Add a custom account instead</button>
      </section>
      <section class="notice">
        <h2>Moving data in?</h2>
        <p>Pick your accounts.csv and balances.csv together. They’ll be saved to OneDrive.</p>
        <input type="file" id="importFiles" accept=".csv,text/csv" multiple hidden>

    startBtn.onclick = async () => {

    };
    document.getElementById("customBtn").onclick = () => openAccountEditor(null);
    const inp = document.getElementById("importFiles");

    inp.onchange = async () => {

      state = fromFiles(await acc.text(), await bal.text());

      render();
