  }

  function renderSignIn(msg) {
    $app.innerHTML = `<section class="notice"><h2>Sign in to OneDrive</h2>
      <p>${msg || "Your balances live in a CSV in your OneDrive. Sign in with your Microsoft account to load them."}</p>
      <button class="primary" id="signIn">Sign in with Microsoft</button></section>`;
    document.getElementById("signIn").onclick = () => msal.loginRedirect({ scopes: SCOPES });
  }

  // ---------- chart ----------
  function drawChart(all) {
    const wrap = document.getElementById("chartWrap");
    if (!wrap) return;
    const days = RANGES[range];
    const cutoff = Date.now() - days * 86400000;
    let pts = all.filter(p => parseISO(p.date).getTime() >= cutoff);
    if (pts.length < all.length && all.length) {
      // include one point before the window so the line enters from the edge
      const before = all.filter(p => parseISO(p.date).getTime() < cutoff).pop();
      if (before) pts = [before, ...pts];
    }

    const rangesHtml = rangeButtons(range, "data-r", "Chart range");

    if (pts.length < 2) {
      wrap.innerHTML = `<div class="chart-empty">${all.length ? "The chart fills in after your second update." : "Your chart shows up after you add balances."}</div>${all.length ? rangesHtml : ""}`;
    } else {
      const W = Math.max(280, wrap.clientWidth || 340), H = 170, padT = 14, padB = 22;
      const xs = pts.map(p => parseISO(p.date).getTime());
      const ys = pts.map(p => p.nw);
      const x0 = xs[0], x1 = xs[xs.length - 1] === x0 ? x0 + 1 : xs[xs.length - 1];
      let y0 = Math.min(...ys), y1 = Math.max(...ys);
      const pad = (y1 - y0) * 0.12 || Math.abs(y1) * 0.05 || 1;
      y0 -= pad; y1 += pad;
      const X = t => ((t - x0) / (x1 - x0)) * (W - 8) + 4;
      const Y = v => padT + (1 - (v - y0) / (y1 - y0)) * (H - padT - padB);
      const line = pts.map((p, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(" ");
      const area = `${line} L${X(xs[xs.length - 1]).toFixed(1)},${H - padB} L${X(xs[0]).toFixed(1)},${H - padB} Z`;
      const up = ys[ys.length - 1] >= ys[0];
      const col = up ? "var(--up)" : "var(--down)";
      const lx = X(xs[xs.length - 1]), ly = Y(ys[ys.length - 1]);
      wrap.innerHTML = `
        <svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Net worth from ${fmt0.format(ys[0])} to ${fmt0.format(ys[ys.length - 1])}">
          <defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
          </linearGradient></defs>
          <path d="${area}" fill="url(#fill)"/>
          <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
          <circle cx="${lx}" cy="${ly}" r="4.5" fill="${col}"/>
          <text x="4" y="${H - 4}" font-size="12" fill="var(--muted)">${shortDate(pts[0].date)}</text>
          <text x="${W - 4}" y="${H - 4}" font-size="12" fill="var(--muted)" text-anchor="end">${shortDate(pts[pts.length - 1].date)}</text>
        </svg>${rangesHtml}`;
    }
    wrap.querySelectorAll("[data-r]").forEach(b => b.onclick = () => { range = b.dataset.r; drawChart(series()); });
    drawBars(pts);
  }

  function drawBars(pts) {
    const el = document.getElementById("barsWrap");
    if (!el) return;
    if (pts.length < 2) { el.innerHTML = ""; return; }
    const diffs = pts.slice(1).map((p, i) => ({ date: p.date, d: p.nw - pts[i].nw }));
    const W = Math.max(280, el.clientWidth || 340), H = 90, mid = H / 2;
    const max = Math.max(...diffs.map(x => Math.abs(x.d))) || 1;
    const slot = W / diffs.length, bw = Math.max(1.5, Math.min(18, slot * 0.7));
    const bars = diffs.map((x, i) => {
      const h = Math.max(1, (Math.abs(x.d) / max) * (mid - 4));
      const y = x.d >= 0 ? mid - h : mid;
      return `<rect x="${(i * slot + (slot - bw) / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(3, bw / 2)}" fill="${x.d >= 0 ? "var(--up)" : "var(--down)"}"><title>${shortDate(x.date)}: ${signed(x.d)}</title></rect>`;
    }).join("");
    const best = diffs.reduce((a, b) => (b.d > a.d ? b : a)), worst = diffs.reduce((a, b) => (b.d < a.d ? b : a));
    const mo = d => parseISO(d).toLocaleDateString("en-US", { month: "short", year: "numeric" });
    el.innerHTML = `<p class="bars-title">Change per update</p>
      <svg class="bars" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Change between updates">
        <line x1="0" x2="${W}" y1="${mid}" y2="${mid}" stroke="var(--line)" stroke-width="1"/>${bars}
      </svg>
      <p class="bars-note">Best: <b class="num up">${signed(best.d)}</b> (${mo(best.date)}). Worst: <b class="num ${worst.d < 0 ? "down" : "up"}">${signed(worst.d)}</b> (${mo(worst.date)}).</p>`;
  }
  let resizeT;
  window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(() => loaded && drawChart(series()), 150); });

  // ---------- sheets ----------
  function openSheet(html) {
    $sheet.innerHTML = html;
    $overlay.classList.add("open");
    document.body.style.overflow = "hidden";
  }
  function closeSheet() {
    $overlay.classList.remove("open");
    document.body.style.overflow = "";
    $sheet.innerHTML = "";
  }
  $overlay.addEventListener("click", e => { if (e.target === $overlay) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $overlay.classList.contains("open")) closeSheet(); });

  // Update balances, one account at a time
  function openUpdate() {
    const active = state.accounts.filter(a => !a.archived).sort((a, b) => catOrder(a) - catOrder(b));
    if (!active.length) return;
    const last = latestBalances();
    const draft = {};
    active.forEach(a => { if (last[a.id] != null) draft[a.id] = last[a.id]; });
    let date = todayISO().slice(0, 8) + "01"; // entries are normalized to the 1st of the month
    let i = 0;

    const step = () => {
      const a = active[i];
      const isLast = i === active.length - 1;
      const cur = draft[a.id];
      openSheet(`
        <div class="sheet-top"><h2>Update balances</h2><button class="text-btn" id="x">Cancel</button></div>
        <div class="date-row"><span>As of</span><input type="date" id="d" value="${date}" max="${todayISO()}"></div>
        <div class="progress"><div style="width:${((i + 1) / active.length) * 100}%"></div></div>
        <p class="step-meta">${i + 1} of ${active.length}</p>
        <p class="step-name">${esc(a.name)}</p>
        <p class="step-kind">${a.kind === "liability" ? "Amount you owe" : "Current balance or value"}</p>
        <div class="money-field"><span>$</span>
          <input id="amt" inputmode="decimal" autocomplete="off" placeholder="0" value="${cur != null ? cur : ""}" aria-label="${esc(a.name)} amount">
        </div>
        <p class="last-val">${last[a.id] != null ? `Last time: ${fmt2.format(last[a.id])}` : "No previous balance"}</p>
        <div class="step-actions">
          <button class="back" id="back">${i === 0 ? "Cancel" : "Back"}</button>
          <button class="next" id="next">${isLast ? "Save" : "Next"}</button>
        </div>`);
      const amt = document.getElementById("amt");
      setTimeout(() => { amt.focus(); amt.select(); }, 60);
      const grab = () => {
        const raw = amt.value.replace(/[$,\s]/g, "");
        if (raw === "") { delete draft[a.id]; return true; }
        const v = parseFloat(raw);
        if (isNaN(v)) { toast("Enter a number, like 1234.56"); return false; }
        draft[a.id] = Math.round(v * 100) / 100;
        return true;
      };
      document.getElementById("d").onchange = e => { if (e.target.value) date = e.target.value; };
      document.getElementById("x").onclick = closeSheet;
      document.getElementById("back").onclick = () => { if (i === 0) return closeSheet(); grab(); i--; step(); };
      const next = async () => {
        if (!grab()) return;
        if (!isLast) { i++; return step(); }
        const existing = state.snapshots.find(s => s.date === date);
        if (existing) Object.assign(existing.balances, draft);
        else state.snapshots.push({ date, balances: { ...draft } });
        closeSheet();
        render();
        await persist();
        toast("Balances saved");
      };
      document.getElementById("next").onclick = next;
      amt.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); next(); } });
    };
    step();
  }

  // Manage accounts
  function openManage() {
    const active = state.accounts.filter(a => !a.archived).sort((a, b) => catOrder(a) - catOrder(b));
    const archived = state.accounts.filter(a => a.archived);
    const ownerName = a => ({ kyle: "Kyle", victoria: "Victoria", joint: "Joint" }[ownerOf(a)]);
    const row = a => `<div class="acct-row">
        <div class="row-name">${esc(a.name)}<div class="acct-kind">${esc(CATEGORIES.find(c => c.id === catOf(a)).name)}, ${ownerName(a)}</div></div>
        <button class="icon-btn" data-edit="${a.id}">Edit</button>
      </div>`;
    openSheet(`
      <div class="sheet-top"><h2>Accounts</h2><button class="text-btn" id="x">Done</button></div>
      ${active.map(row).join("") || `<p class="step-kind">No active accounts.</p>`}
      ${archived.length ? `<p class="archived-title">Closed accounts</p>${archived.map(row).join("")}` : ""}
      <button class="primary" id="add">Add account</button>
      <input type="file" id="reImport" accept=".csv,text/csv" multiple hidden>
      <button class="secondary" id="reImportBtn" style="width:100%">Replace everything from CSV files</button>`);
    document.getElementById("x").onclick = closeSheet;
    document.getElementById("add").onclick = () => openAccountEditor(null);
    const ri = document.getElementById("reImport");
    document.getElementById("reImportBtn").onclick = () => ri.click();
    ri.onchange = async () => {
      const files = [...ri.files];
      const acc = files.find(f => /account/i.test(f.name)), bal = files.find(f => /balance/i.test(f.name));
      if (!acc || !bal) { toast("Select both accounts.csv and balances.csv"); return; }
      const next = fromFiles(await acc.text(), await bal.text());
      if (!next.accounts.length) { toast("Couldn’t read any accounts from that file"); return; }
      if (!confirm(`Replace all data with ${next.accounts.length} accounts and ${next.snapshots.length} entries from these files?`)) return;
      state = next;
      closeSheet();
      render();
      toast("Saving to OneDrive… keep the app open");
      await persist();
    };
    $sheet.querySelectorAll("[data-edit]").forEach(b => b.onclick = () => openAccountEditor(b.dataset.edit));
  }

  function openAccountEditor(id) {
    const acct = id ? state.accounts.find(a => a.id === id) : { name: "", kind: "asset", archived: false };
    let kind = acct.kind;
    let owner = acct.owner || "kyle";
    let category = acct.category || "";
    const catOptions = () => CATEGORIES.filter(c => c.kind === kind).map(c => `<option value="${c.id}" ${c.id === catOf({ kind, category }) ? "selected" : ""}>${esc(c.name)}</option>`).join("");
    openSheet(`
      <div class="sheet-top"><h2>${id ? "Edit account" : "New account"}</h2><button class="text-btn" id="x">Cancel</button></div>
      <div class="field"><label for="nm">Name</label><input id="nm" value="${esc(acct.name)}" placeholder="e.g. Chase checking" autocomplete="off"></div>
      <div class="field"><label>Type</label>
        <div class="seg" role="group">
          <button data-k="asset" aria-pressed="${kind === "asset"}">Asset</button>
          <button data-k="liability" aria-pressed="${kind === "liability"}">Liability</button>
        </div>
      </div>
      <div class="field"><label for="cat">Group</label><select id="cat" class="select">${catOptions()}</select></div>
      <div class="field"><label>Whose</label>
        <div class="seg" role="group">
          ${[["kyle", "Kyle"], ["victoria", "Victoria"], ["joint", "Joint"]].map(([k, n]) => `<button data-o="${k}" aria-pressed="${owner === k}">${n}</button>`).join("")}
        </div>
      </div>
      <button class="primary" id="save">${id ? "Save changes" : "Add account"}</button>
      ${id ? (acct.archived
        ? `<button class="secondary" id="arch" style="width:100%">Reopen account</button>`
        : `<button class="secondary danger" id="arch" style="width:100%">Close account</button>
           <p class="last-val">Closing sets its balance to $0 from today on and keeps its history.</p>`) : ""}`);
    const nm = document.getElementById("nm");
    if (!id) setTimeout(() => nm.focus(), 60);
    document.getElementById("x").onclick = () => (state.accounts.length ? openManage() : closeSheet());
    $sheet.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
      kind = b.dataset.k;
      category = "";
      $sheet.querySelectorAll("[data-k]").forEach(x => x.setAttribute("aria-pressed", x.dataset.k === kind));
      document.getElementById("cat").innerHTML = catOptions();
    });
    $sheet.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      owner = b.dataset.o;
      $sheet.querySelectorAll("[data-o]").forEach(x => x.setAttribute("aria-pressed", x.dataset.o === owner));
    });
    document.getElementById("save").onclick = async () => {
      const name = nm.value.trim();
      if (!name) { toast("Give the account a name"); return; }
      category = document.getElementById("cat").value;
      if (id) { acct.name = name; acct.kind = kind; acct.category = category; acct.owner = owner; }
      else state.accounts.push({ id: newId(), name, kind, category, owner, archived: false });
      render();
      openManage();
      await persist();
    };
    const arch = document.getElementById("arch");
    if (arch) arch.onclick = async () => {
      if (!acct.archived) {
        if (!confirm(`Close ${acct.name}? Its balance becomes $0 from today on.`)) return;
        const d = todayISO();
        const snap = state.snapshots.find(s => s.date === d);
        if (snap) snap.balances[acct.id] = 0; else if (state.snapshots.length) state.snapshots.push({ date: d, balances: { [acct.id]: 0 } });
        acct.archived = true;
      } else {
        acct.archived = false;
      }
      render();
      openManage();
      await persist();
    };
  }

  async function deleteSnapshot(date) {
    if (!confirm(`Delete the entry for ${niceDate(date)}?`)) return;
    state.snapshots = state.snapshots.filter(s => s.date !== date);
    render();
    await persist();
    toast("Entry deleted");
  }

  // ---------- export ----------
  async function exportCSV() {
    const viewWas = view;
    view = "household"; // export always covers every account
    const s = series();
    view = viewWas;
    if (!s.length) return;
    const accts = state.accounts; // same order as the original workbook columns
    const q = v => `"${String(v).replace(/"/g, '""')}"`;
    const sign = (a, v) => (a.kind === "liability" ? -v : v);
    const head = ["Date", ...accts.map(a => q(a.name)), "Assets", "Liabilities", "Net worth"];
    const rows = s.map(p => [p.date, ...accts.map(a => p.balances[a.id] != null ? sign(a, p.balances[a.id]).toFixed(2) : ""), p.assets.toFixed(2), (-p.liabilities).toFixed(2), p.nw.toFixed(2)]);
    const csv = [head.join(","), ...rows.map(r => r.join(","))].join("\n");
    const file = new File([csv], "net-worth-wide.csv", { type: "text/csv" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); } catch (e) {}
    } else {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(file); a.download = file.name; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }
  }

  // Shared with the Budget tab
  window.NW = { readFile, writeFile, parseCSV, toCSV, toast, openSheet, closeSheet, esc };

  // ---------- boot ----------
  async function loadFromOneDrive() {
    try {
      const [acc, bal] = await Promise.all([readFile("accounts.csv"), readFile("balances.csv")]);
      etags = { accounts: acc.etag, balances: bal.etag };
      state = fromFiles(acc.text, bal.text);
      const cached = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (x) { return null; } })();
      if (state.accounts.length && !state.snapshots.length && cached && cached.snapshots && cached.snapshots.length) {
        // History missing in OneDrive (e.g. an interrupted save) but this phone has it: put it back
        state = cached;
        loaded = true;
        render();
        toast("Restoring your history to OneDrive…");
        persist();
        return;
      }
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(state)); } catch (e) {}
      loaded = true;
      if (!$overlay.classList.contains("open")) render();
      window.dispatchEvent(new Event("nw-ready"));
    } catch (e) {
      if (e.message === "redirecting") return;
      const cached = (() => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (x) { return null; } })();
      if (cached) {
        state = cached; loaded = true; render();
        toast("Showing your last saved copy. Saving needs a connection.");
      } else {
        $app.innerHTML = `<section class="notice"><h2>Couldn’t load your data</h2><p>Check your connection and reopen the app.</p></section>`;
      }
    }
  }

  (async () => {
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    if (!window.msal || CLIENT_ID.startsWith("PASTE")) {
      $app.innerHTML = `<section class="notice"><h2>Almost set up</h2><p>Add your Microsoft app’s client ID at the top of index.html.</p></section>`;
      return;
    }
    const here = location.origin + location.pathname.replace(/index\.html$/, "");
    msal = new window.msal.PublicClientApplication({
      auth: { clientId: CLIENT_ID, authority: "https://login.microsoftonline.com/consumers", redirectUri: here },
      cache: { cacheLocation: "localStorage" },
    });
    try {
      const res = await msal.handleRedirectPromise();
      account = (res && res.account) || msal.getAllAccounts()[0] || null;
    } catch (e) {
      return renderSignIn("Sign-in didn’t finish. Try again.");
    }
    if (!account) return renderSignIn();
    loadFromOneDrive();
  })();
})();
</script>
<script>
// ===================== Budget tab =====================
(() => {
  const $b = document.getElementById("budgetApp");
  const $nw = document.getElementById("app");
  const SECTIONS = [
    { id: "necessity", name: "Necessities", color: "#64D2FF" },
    { id: "discretionary", name: "Discretionary", color: "#FF9F0A" },
    { id: "savings", name: "Savings", color: "#30D158" },
  ];
  const VIEWS = [["household", "Household"], ["kyle", "Kyle"], ["victoria", "Victoria"]];
  const DEFAULT_SETTINGS = { kyle_gross: 0, victoria_gross: 0, kyle_net: 0, victoria_net: 0, kyle_own_insurance: 50, paychecks_per_month: 2 };
  let items = [], settings = { ...DEFAULT_SETTINGS };
  let funds = [], pets = [], gifts = [];
  let etag = { items: null, settings: null, funds: null, pets: null, gifts: null }, loaded = false, loading = false, ready = false;
  const round2 = n => Math.round(n * 100) / 100;
  const fundMonthly = f => (f.years > 0 ? f.amount / (f.years * 12) : 0);
  const petMonthly = x => (x.months > 0 ? x.cost / x.months : 0);
  const giftYear = g => g.christmas + g.birthday + g.special;
  // Shared costs split by take-home pay. Kyle's own health insurance is added back,
  // so he's only credited for covering Victoria, not himself.
  const kyleBasis = () => settings.kyle_net + settings.kyle_own_insurance * settings.paychecks_per_month;
  const share = () => { const k = kyleBasis(), t = k + settings.victoria_net; return t > 0 ? k / t : 0.5; };
  const pct = x => (x * 100).toFixed(1) + "%";
  const SPLIT_BY_INCOME = ["mortgage/rent", "property taxes", "homeowners insurance", "hoa", "utilities (gas, electric, water)", "verizon fios"];
  const autoSplit = name => (SPLIT_BY_INCOME.includes(String(name).trim().toLowerCase()) ? "income" : "fixed");
  // Budget lines that add up from a detailed list
  const autoSource = name => ({ "deferred savings": "deferred", "joint deferred": "deferred-joint", "pets": "pets", "gift savings": "gifts" })[String(name).trim().toLowerCase()] || "";
  let view = "household", openGroups = new Set(), openId = null, chain = Promise.resolve();
  const api = () => window.NW;
  const fmt = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt0 = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
  const num = v => { const n = parseFloat(String(v ?? "").replace(/[$,\s]/g, "")); return isNaN(n) ? 0 : Math.round(n * 100) / 100; };
  const kyleAmt = i => i.kyle_p1 + i.kyle_p2;
  const amt = i => (view === "kyle" ? kyleAmt(i) : view === "victoria" ? i.victoria : kyleAmt(i) + i.victoria);
  const income = () => (view === "kyle" ? settings.kyle_net : view === "victoria" ? settings.victoria_net : settings.kyle_net + settings.victoria_net);
  const newId = () => "b" + Math.random().toString(36).slice(2, 9);

  // ---------- tabs ----------
  document.querySelectorAll("[data-tab]").forEach(btn => btn.onclick = () => {
    const tab = btn.dataset.tab;
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-pressed", b.dataset.tab === tab));
    $nw.hidden = tab !== "nw";
    $b.hidden = tab !== "budget";
    if (tab === "budget" && ready && !loaded && !loading) load();
    window.scrollTo(0, 0);
  });
  window.addEventListener("nw-ready", () => { ready = true; if (!$b.hidden && !loaded && !loading) load(); });

  // ---------- data ----------
  function fromCSV(itemsText, settingsText) {
    const a = api();
    const list = itemsText ? a.parseCSV(itemsText).map(r => ({
      id: r.id, name: r.name, section: SECTIONS.some(s => s.id === r.section) ? r.section : "necessity",
      group: r.group || "", kyle_p1: num(r.kyle_p1), kyle_p2: num(r.kyle_p2), victoria: num(r.victoria),
      joint: /^(true|yes|1)$/i.test(r.joint || ""), method: r.method || "", note: r.note || "",
      source: r.source || autoSource(r.name),
      split: r.split === "income" || r.split === "fixed" ? r.split : autoSplit(r.name),
    })).filter(i => i.id && i.name) : [];
    const set = { ...DEFAULT_SETTINGS };
    if (settingsText) a.parseCSV(settingsText).forEach(r => { if (r.key) set[r.key] = num(r.value); });
    return { list, set };
  }

  async function load() {
    loading = true;
    $b.innerHTML = `<p class="loading">Loading…</p>`;
    try {
      const a = api();
      const [it, st, fu, pe, gi] = await Promise.all(["budget.csv", "budget-settings.csv", "funds.csv", "pets.csv", "gifts.csv"].map(n => a.readFile(n)));
      etag = { items: it.etag, settings: st.etag, funds: fu.etag, pets: pe.etag, gifts: gi.etag };
      const d = fromCSV(it.text, st.text);
      items = d.list; settings = d.set;
      parseDetail(fu.text, pe.text, gi.text);
      derive();
      loaded = true;
      render();
    } catch (e) {
      if (e.message === "redirecting") return;
      $b.innerHTML = `<section class="notice"><h2>Couldn’t load your budget</h2><p>Check your connection and reopen the app.</p></section>`;
    } finally { loading = false; }
  }

  function parseDetail(fuText, peText, giText) {
    const a = api();
    funds = fuText ? a.parseCSV(fuText).map(r => ({ id: r.id, name: r.name, category: r.category || "",
      person: ["kyle", "victoria", "joint"].includes(r.person) ? r.person : "joint", started: r.started || "",
      amount: num(r.amount), years: parseFloat(r.years) || 0 })).filter(x => x.id && x.name) : [];
    pets = peText ? a.parseCSV(peText).map(r => ({ id: r.id, product: r.product, pet: r.pet || "", category: r.category || "",
      months: parseFloat(r.months) || 0, cost: num(r.cost) })).filter(x => x.id && x.product) : [];
    gifts = giText ? a.parseCSV(giText).map(r => ({ id: r.id, name: r.name, christmas: num(r.christmas), birthday: num(r.birthday),
      birthday_date: r.birthday_date || "", special: num(r.special), special_date: r.special_date || "" })).filter(x => x.id && x.name) : [];
  }

  const DETAIL_FILES = {
    funds: () => api().toCSV(["id", "name", "category", "person", "started", "amount", "years"],
      funds.map(f => [f.id, f.name, f.category, f.person, f.started, f.amount.toFixed(2), String(f.years)])),
    pets: () => api().toCSV(["id", "product", "pet", "category", "months", "cost"],
      pets.map(x => [x.id, x.product, x.pet, x.category, String(x.months), x.cost.toFixed(2)])),
    gifts: () => api().toCSV(["id", "name", "christmas", "birthday", "birthday_date", "special", "special_date"],
      gifts.map(g => [g.id, g.name, g.christmas.toFixed(2), g.birthday.toFixed(2), g.birthday_date, g.special.toFixed(2), g.special_date])),
  };

  // Keep Kyle's paycheck 1 / 2 proportions when a total is recalculated
  function setKyle(it, total) {
    const sum = it.kyle_p1 + it.kyle_p2, r = sum ? it.kyle_p1 / sum : 0;
    it.kyle_p1 = round2(total * r);
    it.kyle_p2 = round2(total - it.kyle_p1);
  }
  function derive() {
    const sum = (arr, fn) => arr.reduce((t, x) => t + fn(x), 0);
    items.forEach(it => {
      if (it.source === "deferred" && funds.length) {
        setKyle(it, round2(sum(funds.filter(f => f.person === "kyle"), fundMonthly)));
        it.victoria = round2(sum(funds.filter(f => f.person === "victoria"), fundMonthly));
      } else if (it.source === "deferred-joint" && funds.length) {
        const t = round2(sum(funds.filter(f => f.person === "joint"), fundMonthly)), k = round2(t * share());
        setKyle(it, k); it.victoria = round2(t - k);
      } else if (it.source === "pets" && pets.length) {
        setKyle(it, round2(sum(pets, petMonthly)));
      } else if (it.source === "gifts" && gifts.length) {
        setKyle(it, round2(sum(gifts, giftYear) / 12));
      } else if (it.split === "income" && !it.source) {
        setTotal(it, round2(kyleAmt(it) + it.victoria));
      }
    });
  }
  function setTotal(it, total) {
    const k = round2(total * share());
    if (!(it.kyle_p1 + it.kyle_p2)) it.kyle_p1 = 1; // new item: default to paycheck 1
    setKyle(it, k);
    it.victoria = round2(total - k);
  }
  const hasDetail = it => (it.source === "deferred" || it.source === "deferred-joint") ? funds.length > 0
    : it.source === "pets" ? pets.length > 0 : it.source === "gifts" ? gifts.length > 0 : false;

  function save(extra = []) {
    const a = api();
    const itemsCSV = a.toCSV(["id", "name", "section", "group", "kyle_p1", "kyle_p2", "victoria", "joint", "method", "note", "source", "split"],
      items.map(i => [i.id, i.name, i.section, i.group, i.kyle_p1.toFixed(2), i.kyle_p2.toFixed(2), i.victoria.toFixed(2), i.joint ? "true" : "false", i.method, i.note, i.source || "", i.split || "fixed"]));
    const setCSV = a.toCSV(["key", "value"], Object.entries(settings).map(([k, v]) => [k, String(v)]));
    const extraCSV = extra.map(k => [k, DETAIL_FILES[k]()]);
    a.toast("Saving…");
    chain = chain.then(async () => {
      for (const [k, text] of extraCSV) etag[k] = await a.writeFile(`${k}.csv`, text, etag[k]);
      etag.items = await a.writeFile("budget.csv", itemsCSV, etag.items);
      etag.settings = await a.writeFile("budget-settings.csv", setCSV, etag.settings);
      a.toast("Saved to OneDrive");
    }).catch(e => {
      if (e.message === "redirecting") return;
      if (e.code === "conflict") { a.toast("The budget changed somewhere else. Reloading."); load(); }
      else a.toast(`Couldn’t save the budget (${e.message})`);
    });
    return chain;
  }

  // ---------- render ----------
  function subLine(i) {
    const parts = [];
    if (view === "household" && kyleAmt(i) && i.victoria) parts.push(`Kyle ${fmt.format(kyleAmt(i))}, Victoria ${fmt.format(i.victoria)}`);
    if (view === "kyle" && i.kyle_p1 && i.kyle_p2) parts.push(`Paycheck 1 ${fmt.format(i.kyle_p1)}, Paycheck 2 ${fmt.format(i.kyle_p2)}`);
    else if (view === "kyle" && (i.kyle_p1 || i.kyle_p2)) parts.push(i.kyle_p1 ? "Paycheck 1" : "Paycheck 2");
    if (i.split === "income" && !i.source) parts.push(`Split by take-home pay, ${pct(share())} / ${pct(1 - share())}`);
    if (i.source === "deferred-joint") parts.push(`Split by take-home pay, ${pct(share())} / ${pct(1 - share())}`);
    if (i.method) parts.push(i.method);
    if (i.joint) parts.push("Joint account");
    return parts.join(". ");
  }

  // Collapsed: name + amount. Tapped: description plus quick amount edit.
  function itemRow(i, child) {
    const esc = api().esc, open = openId === i.id;
    let html = `<div class="b-row${child ? " child" : ""}${open ? " open" : ""}" data-toggle="${i.id}" role="button" tabindex="0" aria-expanded="${open}">
      <div class="b-name">${esc(i.name)}</div>
      <div class="b-amt num">${fmt.format(amt(i))}</div></div>`;
    if (!open) return html;
    const sub = subLine(i);
    const money = v => (v ? v.toFixed(2) : "");
    const f = (key, label, v) => `<label class="b-q"><span>${label}</span><input data-q="${key}" value="${money(v)}" inputmode="decimal" placeholder="0.00" autocomplete="off"></label>`;
    let fields = view === "kyle" ? [f("kyle_p1", "Paycheck 1", i.kyle_p1), f("kyle_p2", "Paycheck 2", i.kyle_p2)]
      : view === "victoria" ? [f("victoria", "Victoria", i.victoria)]
      : [f("kyle_p1", "Kyle P1", i.kyle_p1), f("kyle_p2", "Kyle P2", i.kyle_p2), f("victoria", "Victoria", i.victoria)];
    const linked = hasDetail(i);
    if (!linked && i.split === "income") fields = [f("total", "Total (split automatically)", kyleAmt(i) + i.victoria)];
    if (linked) {
      // Amounts come from the list; only portions the list doesn't cover stay editable
      const computedVictoria = i.source === "deferred" || i.source === "deferred-joint";
      fields = (!computedVictoria && view !== "kyle") ? [f("victoria", "Victoria (not in list)", i.victoria)] : [];
    }
    html += `<div class="b-detail${child ? " child" : ""}" data-detail="${i.id}">
      ${sub ? `<p class="b-sub">${esc(sub)}</p>` : ""}${i.note ? `<p class="b-note">${esc(i.note)}</p>` : ""}
      ${linked ? breakdown(i) : ""}
      ${fields.length ? `<div class="b-quick">${fields.join("")}</div>` : ""}
      <div class="b-actions">${fields.length ? `<button class="b-save" data-qsave="${i.id}">Save</button>` : ""}<button class="b-more" data-more="${i.id}">More options</button></div>
    </div>`;
    return html;
  }

  function breakdown(it) {
    const esc = api().esc;
    let rows = [], head = "", addType = "", addLabel = "";
    const line = (type, id, name, value, sub) => `<div class="sub-row" data-sub="${type}:${id}" role="button" tabindex="0">
      <div class="b-name">${esc(name)}${sub ? `<div class="b-sub">${esc(sub)}</div>` : ""}</div><div class="b-amt num">${fmt.format(value)}</div></div>`;
    if (it.source === "deferred" || it.source === "deferred-joint") {
      const people = it.source === "deferred-joint" ? ["joint"] : view === "kyle" ? ["kyle"] : view === "victoria" ? ["victoria"] : ["kyle", "victoria"];
      const k = it.source === "deferred-joint" ? (view === "kyle" ? share() : view === "victoria" ? 1 - share() : 1) : 1;
      const list = funds.filter(f => people.includes(f.person)).map(f => ({ f, m: fundMonthly(f) * k })).sort((a, b) => b.m - a.m);
      const target = list.reduce((t, x) => t + x.f.amount, 0);
      head = `${list.length} funds saving toward ${fmt0.format(target)}${it.source === "deferred-joint" && view !== "household" ? `, your ${Math.round(k * 100)}% share` : ""}`;
      rows = list.map(({ f, m }) => line("fund", f.id, f.name, m, people.length > 1 ? (f.person === "kyle" ? "Kyle" : "Victoria") : ""));
      addType = "fund"; addLabel = "Add fund";
    } else if (it.source === "pets") {
      const list = [...pets].sort((a, b) => petMonthly(b) - petMonthly(a));
      head = `${list.length} recurring pet costs`;
      rows = list.map(x => line("pet", x.id, x.product, petMonthly(x), x.pet));
      addType = "pet"; addLabel = "Add pet expense";
    } else if (it.source === "gifts") {
      const list = [...gifts].sort((a, b) => giftYear(b) - giftYear(a));
      head = `${fmt.format(list.reduce((t, g) => t + giftYear(g), 0))} a year across ${list.length} people`;
      rows = list.map(g => line("gift", g.id, g.name, giftYear(g) / 12, `${fmt0.format(giftYear(g))} a year`));
      addType = "gift"; addLabel = "Add person";
    }
    return `<p class="sub-head">${esc(head)}</p><div class="sub-list">${rows.join("")}</div>
      <button class="text-btn sub-add" data-add="${addType}">${addLabel}</button>`;
  }

  async function quickSave(id) {
    const it = items.find(i => i.id === id);
    const panel = $b.querySelector(`[data-detail="${id}"]`);
    if (!it || !panel) return;
    let changed = false;
    panel.querySelectorAll("[data-q]").forEach(inp => {
      const v = num(inp.value);
      if (inp.dataset.q === "total") {
        if (round2(kyleAmt(it) + it.victoria) !== v) { setTotal(it, v); changed = true; }
      } else if (it[inp.dataset.q] !== v) { it[inp.dataset.q] = v; changed = true; }
    });
    openId = null;
    render();
    if (changed) await save();
  }

  function render() {
    if (!loaded) return;
    const a = api(), esc = a.esc;
    if (!items.length && !(settings.kyle_net || settings.victoria_net)) return renderEmpty();

    const inc = income();
    const live = items.filter(i => amt(i) > 0.004);
    const idle = items.filter(i => amt(i) <= 0.004);
    const totals = Object.fromEntries(SECTIONS.map(s => [s.id, live.filter(i => i.section === s.id).reduce((t, i) => t + amt(i), 0)]));
    const budgeted = totals.necessity + totals.discretionary + totals.savings;
    const remaining = Math.round((inc - budgeted) * 100) / 100;
    const rate = inc ? totals.savings / inc : 0;
    const label = view === "household" ? "Household" : view === "kyle" ? "Kyle’s" : "Victoria’s";

    let remainHtml;
    if (Math.abs(remaining) < 0.01) remainHtml = `<span class="b-pos">Every dollar assigned</span>`;
    else if (remaining > 0) remainHtml = `<span class="b-pos num">${fmt.format(remaining)} unassigned</span>`;
    else remainHtml = `<span class="b-neg num">${fmt.format(-remaining)} over income</span>`;

    const allocHtml = budgeted ? `<section class="alloc">
      <div class="alloc-bar">${SECTIONS.map(s => `<span style="width:${(totals[s.id] / budgeted) * 100}%;background:${s.color}"></span>`).join("")}</div>
      <div class="alloc-legend">${SECTIONS.map(s => `<span><i class="dot" style="background:${s.color}"></i>${s.name} <b class="num">${inc ? Math.round((totals[s.id] / inc) * 100) : 0}%</b></span>`).join("")}</div>
    </section>` : "";

    let payHtml = "";
    if (view === "kyle") {
      const half = settings.kyle_net / 2;
      const p1 = live.reduce((t, i) => t + i.kyle_p1, 0), p2 = live.reduce((t, i) => t + i.kyle_p2, 0);
      const cell = (n, spent) => { const left = half - spent; return `<div><span>${n}</span><b class="num">${fmt.format(spent)}</b>
        <em class="num ${left >= -0.004 ? "up" : "down"}">${left >= -0.004 ? fmt.format(left) + " left" : fmt.format(-left) + " short"}</em></div>`; };
      payHtml = `<section class="alloc"><p class="card-title">Per paycheck (${fmt.format(half)} each)</p>
        <div class="pay-grid">${cell("Paycheck 1 (1st–15th)", p1)}${cell("Paycheck 2 (16th–31st)", p2)}</div></section>`;
    }

    const joint = live.filter(i => i.joint);
    let jointHtml = "";
    if (joint.length) {
      const k = joint.reduce((t, i) => t + kyleAmt(i), 0), v = joint.reduce((t, i) => t + i.victoria, 0);
      const lines = view === "household" ? [["Kyle", k], ["Victoria", v], ["Total", k + v]] : view === "kyle" ? [["Kyle", k]] : [["Victoria", v]];
      jointHtml = `<section class="alloc"><p class="card-title">Pay into the joint account each month</p>
        ${lines.map(([n, x]) => `<div class="joint-line"><span>${n}</span><span class="num">${fmt.format(x)}</span></div>`).join("")}</section>`;
    }

    const sectionHtml = s => {
      const list = live.filter(i => i.section === s.id);
      if (!list.length) return "";
      const seen = new Set(), rows = [];
      list.forEach(i => {
        if (!i.group) { rows.push(itemRow(i)); return; }
        if (seen.has(i.group)) return;
        seen.add(i.group);
        const kids = list.filter(x => x.group === i.group);
        const open = openGroups.has(s.id + "|" + i.group);
        rows.push(`<div class="b-row" data-group="${esc(s.id + "|" + i.group)}" role="button" tabindex="0" aria-expanded="${open}">
          <div class="b-name">${esc(i.group)}<span class="b-caret">${open ? "▲" : "▼"} ${kids.length}</span></div>
          <div class="b-amt num">${fmt.format(kids.reduce((t, x) => t + amt(x), 0))}</div></div>`);
        if (open) kids.forEach(x => rows.push(itemRow(x, true)));
      });
      return `<section class="group"><div class="group-head"><h2><i class="dot" style="background:${s.color}"></i>${s.name}</h2>
        <span class="num">${fmt.format(totals[s.id])}</span></div>${rows.join("")}</section>`;
    };

    $b.innerHTML = `
      <div class="seg view-seg" role="group" aria-label="Whose budget">
        ${VIEWS.map(([k, n]) => `<button data-bview="${k}" aria-pressed="${view === k}">${n}</button>`).join("")}
      </div>
      <section class="hero">
        <p class="hero-label">${label} monthly take-home</p>
        <p class="hero-total num">${fmt0.format(inc)}</p>
        <p class="hero-change">Budgeted <span class="num">${fmt.format(budgeted)}</span>. ${remainHtml}</p>
        <p class="hero-equity">Savings rate <b class="num">${(rate * 100).toFixed(1)}%</b></p>
      </section>
      <div style="height:14px"></div>
      ${allocHtml}${payHtml}${jointHtml}
      ${SECTIONS.map(sectionHtml).join("")}
      ${idle.length ? `<details class="history"><summary>Not budgeted (${idle.length})</summary>${idle.map(i => itemRow(i)).join("")}</details>` : ""}
      <div class="footer">
        <button class="secondary" id="bAdd">Add item</button>
        <button class="secondary" id="bIncome">Income</button>
      </div>`;

    $b.querySelectorAll("[data-bview]").forEach(btn => btn.onclick = () => { view = btn.dataset.bview; render(); });
    $b.querySelectorAll("[data-group]").forEach(r => {
      const t = () => { const g = r.dataset.group; openGroups.has(g) ? openGroups.delete(g) : openGroups.add(g); render(); };
      r.onclick = t; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };
    });
    $b.querySelectorAll("[data-toggle]").forEach(r => {
      const t = () => { openId = openId === r.dataset.toggle ? null : r.dataset.toggle; render(); };
      r.onclick = t; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };
    });
    $b.querySelectorAll("[data-qsave]").forEach(btn => btn.onclick = () => quickSave(btn.dataset.qsave));
    $b.querySelectorAll("[data-sub]").forEach(r => {
      const [type, id] = r.dataset.sub.split(":");
      const t = () => (type === "fund" ? openFund(id) : type === "pet" ? openPet(id) : openGift(id));
      r.onclick = t; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t(); } };
    });
    $b.querySelectorAll("[data-add]").forEach(btn => btn.onclick = () => {
      const t = btn.dataset.add;
      t === "fund" ? openFund(null) : t === "pet" ? openPet(null) : openGift(null);
    });
    $b.querySelectorAll("[data-more]").forEach(btn => btn.onclick = () => openItem(btn.dataset.more));
    $b.querySelectorAll("[data-q]").forEach(inp => {
      inp.onfocus = () => inp.select();
      inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); quickSave(inp.closest("[data-detail]").dataset.detail); } };
    });
    document.getElementById("bAdd").onclick = () => openItem(null);
    document.getElementById("bIncome").onclick = openIncome;
  }

  function renderEmpty() {
    $b.innerHTML = `<section class="notice"><h2>Set up your budget</h2>
      <p>Pick your budget.csv and budget-settings.csv together, or start from scratch.</p>
      <input type="file" id="bImport" accept=".csv,text/csv" multiple hidden>
      <button class="primary" id="bImportBtn">Import CSV files</button>
      <button class="text-btn" id="bScratch">Start from scratch</button></section>`;
    const inp = document.getElementById("bImport");
    document.getElementById("bImportBtn").onclick = () => inp.click();
    inp.onchange = async () => {
      const files = [...inp.files];
      const it = files.find(f => /budget(?!-settings)/i.test(f.name) && !/settings/i.test(f.name));
      const st = files.find(f => /settings/i.test(f.name));
      if (!it) { api().toast("Select budget.csv (and budget-settings.csv)"); return; }
      const d = fromCSV(await it.text(), st ? await st.text() : "");
      if (!d.list.length) { api().toast("Couldn’t read any budget items"); return; }
      items = d.list; settings = d.set;
      render();
      await save();
    };
    document.getElementById("bScratch").onclick = openIncome;
  }

  // ---------- editing ----------
  const field = (id, label, value, mode) => `<div class="field"><label for="${id}">${label}</label>
    <input id="${id}" value="${value}" ${mode ? `inputmode="${mode}"` : ""} autocomplete="off"></div>`;

  function openItem(id) {
    const a = api(), esc = a.esc;
    const it = id ? items.find(i => i.id === id) : { name: "", section: "necessity", group: "", kyle_p1: 0, kyle_p2: 0, victoria: 0, joint: false, method: "", note: "" };
    let joint = it.joint;
    let split = it.split || "fixed";
    const groups = [...new Set(items.map(i => i.group).filter(Boolean))];
    const money = v => (v ? v.toFixed(2) : "");
    a.openSheet(`
      <div class="sheet-top"><h2>${id ? "Edit item" : "New item"}</h2><button class="text-btn" id="bx">Cancel</button></div>
      ${field("bn", "Name", esc(it.name))}
      <div class="field"><label for="bs">Section</label><select id="bs" class="select">
        ${SECTIONS.map(s => `<option value="${s.id}" ${s.id === it.section ? "selected" : ""}>${s.name}</option>`).join("")}</select></div>
      <div class="field"><label for="bg">Group (optional, e.g. Streaming)</label>
        <input id="bg" value="${esc(it.group)}" list="bgl" autocomplete="off"><datalist id="bgl">${groups.map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>
      <div class="toggle-row"><label>How it’s split</label>
        <div class="seg" role="group" style="width:200px"><button data-sp="income" aria-pressed="${split === "income"}">By income</button><button data-sp="fixed" aria-pressed="${split === "fixed"}">Fixed</button></div></div>
      <div id="bIncomeFields" ${split === "income" ? "" : "hidden"}>
        ${field("btot", `Monthly total (Kyle ${pct(share())}, Victoria ${pct(1 - share())})`, money(kyleAmt(it) + it.victoria), "decimal")}
      </div>
      <div id="bFixedFields" ${split === "fixed" ? "" : "hidden"}>
        ${field("bk1", "Kyle, paycheck 1 (1st–15th)", money(it.kyle_p1), "decimal")}
        ${field("bk2", "Kyle, paycheck 2 (16th–31st)", money(it.kyle_p2), "decimal")}
        ${field("bv", "Victoria", money(it.victoria), "decimal")}
      </div>
      <div class="toggle-row"><label>Paid from joint account</label>
        <div class="seg" role="group" style="width:150px"><button data-j="1" aria-pressed="${joint}">Yes</button><button data-j="0" aria-pressed="${!joint}">No</button></div></div>
      ${field("bm", "Paid with (optional)", esc(it.method))}
      ${field("bo", "Note (optional)", esc(it.note))}
      <button class="primary" id="bsave">${id ? "Save" : "Add item"}</button>
      ${id ? `<button class="secondary danger" id="bdel" style="width:100%">Delete item</button>` : ""}`);
    const $s = document.getElementById("sheet");
    $s.querySelectorAll("[data-j]").forEach(b => b.onclick = () => {
      joint = b.dataset.j === "1";
      $s.querySelectorAll("[data-j]").forEach(x => x.setAttribute("aria-pressed", (x.dataset.j === "1") === joint));
    });
    $s.querySelectorAll("[data-sp]").forEach(b => b.onclick = () => {
      split = b.dataset.sp;
      $s.querySelectorAll("[data-sp]").forEach(x => x.setAttribute("aria-pressed", x.dataset.sp === split));
      document.getElementById("bIncomeFields").hidden = split !== "income";
      document.getElementById("bFixedFields").hidden = split !== "fixed";
    });
    document.getElementById("bx").onclick = a.closeSheet;
    document.getElementById("bsave").onclick = async () => {
      const name = document.getElementById("bn").value.trim();
      if (!name) { a.toast("Give it a name"); return; }
      const next = {
        name, section: document.getElementById("bs").value, group: document.getElementById("bg").value.trim(),
        kyle_p1: num(document.getElementById("bk1").value), kyle_p2: num(document.getElementById("bk2").value),
        victoria: num(document.getElementById("bv").value), joint, split,
        method: document.getElementById("bm").value.trim(), note: document.getElementById("bo").value.trim(),
      };
      let target = it;
      if (id) Object.assign(it, next); else { target = { id: newId(), source: "", ...next }; items.push(target); }
      if (split === "income" && !target.source) setTotal(target, num(document.getElementById("btot").value));
      a.closeSheet(); render(); await save();
    };
    const del = document.getElementById("bdel");
    if (del) del.onclick = async () => {
      if (!confirm(`Delete ${it.name}?`)) return;
      items = items.filter(i => i.id !== id);
      a.closeSheet(); render(); await save();
    };
  }

  // ---------- detail editors ----------
  const addMonths = (iso, months) => {
    if (!iso) return null;
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(y, m - 1 + Math.round(months), d);
    dt.setDate(dt.getDate() - 1);
    return dt;
  };
  const longDate = dt => dt ? dt.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "";
  function sheetShell(title, body, delId) {
    return `<div class="sheet-top"><h2>${title}</h2><button class="text-btn" id="dx">Cancel</button></div>${body}
      <p class="last-val" id="dlive"></p>
      <button class="primary" id="dsave">Save</button>
      ${delId ? `<button class="secondary danger" id="ddel" style="width:100%">Delete</button>` : ""}`;
  }
  function finishDetail(kind, onSave, onDelete, live) {
    const a = api();
    document.getElementById("dx").onclick = a.closeSheet;
    if (live) {
      const upd = () => { document.getElementById("dlive").textContent = live(); };
      document.getElementById("sheet").querySelectorAll("input").forEach(i => i.addEventListener("input", upd));
      upd();
    }
    document.getElementById("dsave").onclick = async () => {
      if (onSave() === false) return;
      derive(); a.closeSheet(); render(); await save([kind]);
    };
    const del = document.getElementById("ddel");
    if (del) del.onclick = async () => {
      if (!confirm("Delete this?")) return;
      onDelete(); derive(); a.closeSheet(); render(); await save([kind]);
    };
  }
  const val = id => document.getElementById(id).value;

  function openFund(id) {
    const a = api(), esc = a.esc;
    const f = id ? funds.find(x => x.id === id) : { name: "", category: "", person: "joint", started: "", amount: 0, years: 1 };
    let person = f.person;
    const cats = [...new Set(funds.map(x => x.category).filter(Boolean))];
    a.openSheet(sheetShell(id ? "Edit fund" : "New fund", `
      ${field("fn", "What you’re saving for", esc(f.name))}
      <div class="field"><label for="fc">Category</label><input id="fc" value="${esc(f.category)}" list="fcl" autocomplete="off">
        <datalist id="fcl">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div>
      <div class="field"><label>Whose</label><div class="seg" role="group">
        ${[["kyle", "Kyle"], ["victoria", "Victoria"], ["joint", "Joint"]].map(([k, n]) => `<button data-fp="${k}" aria-pressed="${person === k}">${n}</button>`).join("")}</div></div>
      ${field("fa", "Amount needed", f.amount ? f.amount.toFixed(2) : "", "decimal")}
      ${field("fy", "Every how many years", f.years ? String(f.years) : "", "decimal")}
      <div class="field"><label for="fs">Started saving</label><input id="fs" type="date" value="${f.started}"></div>`, id));
    const $s = document.getElementById("sheet");
    $s.querySelectorAll("[data-fp]").forEach(b => b.onclick = () => {
      person = b.dataset.fp;
      $s.querySelectorAll("[data-fp]").forEach(x => x.setAttribute("aria-pressed", x.dataset.fp === person));
    });
    finishDetail("funds", () => {
      const name = val("fn").trim(); if (!name) { a.toast("Give it a name"); return false; }
      const next = { name, category: val("fc").trim(), person, amount: num(val("fa")), years: parseFloat(val("fy")) || 0, started: val("fs") };
      if (id) Object.assign(f, next); else funds.push({ id: newId(), ...next });
    }, () => { funds = funds.filter(x => x.id !== id); }, () => {
      const amt = num(val("fa")), yrs = parseFloat(val("fy")) || 0;
      const due = addMonths(val("fs"), yrs * 12);
      return `${yrs ? fmt.format(amt / (yrs * 12)) : "$0.00"} a month${due ? `. Due ${longDate(due)}` : ""}`;
    });
  }

  function openPet(id) {
    const a = api(), esc = a.esc;
    const x = id ? pets.find(p => p.id === id) : { product: "", pet: "", category: "", months: 1, cost: 0 };
    a.openSheet(sheetShell(id ? "Edit pet expense" : "New pet expense", `
      ${field("pp", "Product", esc(x.product))}
      ${field("pw", "Pet", esc(x.pet))}
      ${field("pc", "Category", esc(x.category))}
      ${field("pk", "Cost each time", x.cost ? x.cost.toFixed(2) : "", "decimal")}
      ${field("pm", "Lasts how many months", x.months ? String(x.months) : "", "decimal")}`, id));
    finishDetail("pets", () => {
      const product = val("pp").trim(); if (!product) { a.toast("Give it a name"); return false; }
      const next = { product, pet: val("pw").trim(), category: val("pc").trim(), cost: num(val("pk")), months: parseFloat(val("pm")) || 0 };
      if (id) Object.assign(x, next); else pets.push({ id: newId(), ...next });
    }, () => { pets = pets.filter(p => p.id !== id); }, () => {
      const m = parseFloat(val("pm")) || 0;
      return `${m ? fmt.format(num(val("pk")) / m) : "$0.00"} a month`;
    });
  }

  function openGift(id) {
    const a = api(), esc = a.esc;
    const g = id ? gifts.find(x => x.id === id) : { name: "", christmas: 0, birthday: 0, birthday_date: "", special: 0, special_date: "" };
    const m = v => (v ? v.toFixed(2) : "");
    a.openSheet(sheetShell(id ? "Edit gifts" : "New person", `
      ${field("gn", "Name", esc(g.name))}
      ${field("gc", "Christmas", m(g.christmas), "decimal")}
      ${field("gb", "Birthday", m(g.birthday), "decimal")}
      <div class="field"><label for="gbd">Birthday date</label><input id="gbd" type="date" value="${g.birthday_date}"></div>
      ${field("gs", "Special occasion", m(g.special), "decimal")}
      <div class="field"><label for="gsd">Special occasion date</label><input id="gsd" type="date" value="${g.special_date}"></div>`, id));
    finishDetail("gifts", () => {
      const name = val("gn").trim(); if (!name) { a.toast("Give it a name"); return false; }
      const next = { name, christmas: num(val("gc")), birthday: num(val("gb")), birthday_date: val("gbd"), special: num(val("gs")), special_date: val("gsd") };
      if (id) Object.assign(g, next); else gifts.push({ id: newId(), ...next });
    }, () => { gifts = gifts.filter(x => x.id !== id); }, () => {
      const y = num(val("gc")) + num(val("gb")) + num(val("gs"));
      return `${fmt.format(y)} a year, ${fmt.format(y / 12)} a month`;
    });
  }

  function openIncome() {
    const a = api();
    a.openSheet(`
      <div class="sheet-top"><h2>Income</h2><button class="text-btn" id="ix">Cancel</button></div>
      <p class="step-kind">Monthly take-home after taxes and benefits. Budget percentages use these.</p>
      ${field("ikn", "Kyle, net monthly", settings.kyle_net ? settings.kyle_net.toFixed(2) : "", "decimal")}
      ${field("ivn", "Victoria, net monthly", settings.victoria_net ? settings.victoria_net.toFixed(2) : "", "decimal")}
      ${field("iki", "Kyle’s own health insurance, per paycheck", settings.kyle_own_insurance ? settings.kyle_own_insurance.toFixed(2) : "", "decimal")}
      ${field("ikg", "Kyle, gross annual", settings.kyle_gross ? String(settings.kyle_gross) : "", "decimal")}
      ${field("ivg", "Victoria, gross annual", settings.victoria_gross ? String(settings.victoria_gross) : "", "decimal")}
      <p class="last-val" id="ishare"></p>
      <button class="primary" id="isave">Save and recalculate splits</button>`);
    const preview = () => {
      const k = num(document.getElementById("ikn").value) + num(document.getElementById("iki").value) * settings.paychecks_per_month;
      const t = k + num(document.getElementById("ivn").value);
      document.getElementById("ishare").textContent = t ? `Shared costs split Kyle ${pct(k / t)}, Victoria ${pct(1 - k / t)}` : "";
    };
    document.getElementById("sheet").querySelectorAll("input").forEach(i => i.addEventListener("input", preview));
    preview();
    document.getElementById("ix").onclick = a.closeSheet;
    document.getElementById("isave").onclick = async () => {
      settings.kyle_net = num(document.getElementById("ikn").value);
      settings.victoria_net = num(document.getElementById("ivn").value);
      settings.kyle_own_insurance = num(document.getElementById("iki").value);
      settings.kyle_gross = num(document.getElementById("ikg").value);
      settings.victoria_gross = num(document.getElementById("ivg").value);
      loaded = true;
      derive();
      a.closeSheet(); render(); await save();
    };
  }
})();
</script>
</body>
</html>
